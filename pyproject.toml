[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utils-flask-sqlalchemy-geo"
dynamic = ["version"]
description = "Python lib of tools for Flask and SQLAlchemy (extension geometry)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy<3",
    "fiona",
    "geoalchemy2>=0.4.0",
    "shapely",
    "utils-flask-sqlalchemy>=0.5.0",
    "marshmallow",
    "marshmallow_sqlalchemy",
    "geojson",
]
license = { text = "GNU Affero General Public License v3" }
maintainers = [
    { name = "Parcs nationaux des Écrins et des Cévennes", email = "geonature@ecrins-parcnational.fr" }
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/PnX-SI/Utils-Flask-SQLAlchemy-Geo"

[project.optional-dependencies]
tests = ["pytest", "flask-sqlalchemy"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["src"]

[tool.coverage.run]
source_pkgs = ["utils_flask_sqla_geo"]
omit = ["*/tests/*"]

[tool.black]
line-length = 99
